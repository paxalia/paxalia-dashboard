[metadata]
name = paxalia-dashboard
version = 4.0.0
description = Privacy-first, self-hosted analytics dashboard for Django. Beautiful, configurable, and fully offline.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/paxalia/paxalia-dashboard
author = Paxalia
author_email = paxalia.app@gmail.com
license = Apache-2.0
classifiers =
    Development Status :: 5 - Production/Stable
    Environment :: Web Environment
    Framework :: Django
    Framework :: Django :: 5.0
    Framework :: Django :: 6.0
    Intended Audience :: Developers
    License :: OSI Approved :: Apache Software License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Internet :: Log Analysis
    Topic :: Internet :: WWW/HTTP :: Dynamic Content
keywords = django, analytics, privacy, self-hosted, dashboard, geoip, world-map, chartjs

[options]
python_requires = >=3.10
install_requires =
    Django>=5.0
    geoip2>=4.8
    user-agents>=2.2.0
    pycountry>=22.3.5
    psutil>=5.9.0
    django-honeypot>=1.2.1
    cryptography>=46.0.0
    django-otp>=1.7.0,<2.0
    qrcode>=8.0,<9.0
    webauthn>=3.0.0,<4.0
include_package_data = true
packages = find:

[options.package_data]
paxalia =
    templates/paxalia/*
    templates/paxalia_auth/*
    templates/paxalia/includes/*
    templates/paxalia/admin/*
    static/paxalia/icons/archive/*
    static/paxalia/icons/ui/*
    static/paxalia/icons/ui-multi/*
    static/paxalia/icons/brand/*
    static/paxalia/scripts/*
    static/paxalia/scripts/server/*
    static/paxalia/styles/*
    static/paxalia/styles/components/*
    locale/*/LC_MESSAGES/*.po
    geoip/*.mmdb
