[metadata]
name = django-zaydany-analytics
version = 2.1.1
description = Privacy-first, self-hosted analytics dashboard for Django. Beautiful, configurable, and fully offline.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/parsazaydany/django-zaydany-analytics
author = Parsa Zaydany
author_email = parsazaidane@gmail.com
license = Apache-2.0
classifiers =
    Development Status :: 5 - Production/Stable
    Environment :: Web Environment
    Framework :: Django
    Framework :: Django :: 5.0
    Intended Audience :: Developers
    License :: OSI Approved :: Apache Software License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Internet :: Log Analysis
    Topic :: Internet :: WWW/HTTP :: Dynamic Content
keywords = django, analytics, privacy, self-hosted, dashboard, geoip, world-map, chartjs

[options]
python_requires = >=3.10
install_requires =
    Django>=5.0
    geoip2>=4.8
    user-agents>=2.2.0
    pycountry>=22.3.5
    psutil>=5.9.0
    django-honeypot>=1.2.1
include_package_data = true
packages = find:

[options.package_data]
analytics =
    templates/analytics/*
    templates/analytics/includes/*
    static/analytics/icons/archive/*
    static/analytics/icons/ui/*
    static/analytics/icons/ui-multi/*
    static/analytics/icons/brand/*
    static/analytics/scripts/*
    static/analytics/scripts/server/*
    static/analytics/styles/*
    static/analytics/styles/components/*
    locale/*/LC_MESSAGES/*.po
    geoip/*.mmdb