{% extends 'paxalia/auth_base.html' %}
{% load i18n %}
{% block title %}{% trans "Password changed" %} · {{ brand_name }}{% endblock %}
{% block content %}
<section class="paxalia-auth-card" aria-labelledby="reset-complete-heading"><header class="paxalia-auth-card__header"><div class="paxalia-auth-icon" aria-hidden="true">✓</div><h1 id="reset-complete-heading">{% trans "Password changed" %}</h1><p>{% trans "Your password was updated successfully." %}</p></header><div class="paxalia-auth-card__body"><a href="{% url 'paxalia:auth_login' %}" class="btn btn-primary paxalia-auth-submit">{% trans "Log in" %}</a></div></section>
{% endblock %}
